<!DOCTYPE html>
<html lang="en"><head><title></title><script>
function botguardYukle(meydan) {
  window.vm = window[meydan.globalName];
  window.program = meydan.program;
  window.vmFunctions = {};
  window.syncSnapshotFunction = null;

  if (!window.vm) throw new Error('BotGuard: VM yok (' + meydan.globalName + ')');
  if (!window.vm.a) throw new Error('BotGuard: program yuklenemedi');

  var geriCagri = function (asyncSnapshotFunction, shutdownFunction, passEventFunction, checkCameraFunction) {
    window.vmFunctions = {
      asyncSnapshotFunction: asyncSnapshotFunction,
      shutdownFunction: shutdownFunction,
      passEventFunction: passEventFunction,
      checkCameraFunction: checkCameraFunction
    };
  };

  window.syncSnapshotFunction = window.vm.a(window.program, geriCagri, true, window.userInteractionElement, function () {}, [[], []])[0];

  return new Promise(function (resolve, reject) {
    var i = 0;
    var z = setInterval(function () {
      if (!!window.vmFunctions.asyncSnapshotFunction) { resolve(window); clearInterval(z); }
      if (i >= 10000) { reject(new Error('asyncSnapshotFunction 10 saniyede gelmedi')); clearInterval(z); }
      i += 1;
    }, 1);
  });
}

function anlikGoruntu(args) {
  return new Promise(function (resolve, reject) {
    if (!window.vmFunctions.asyncSnapshotFunction)
      return reject(new Error('BotGuard: asyncSnapshotFunction yok'));
    window.vmFunctions.asyncSnapshotFunction(function (yanit) { resolve(yanit); }, [
      args.contentBinding,
      args.signedTimestamp,
      args.webPoSignalOutput,
      args.skipPrivacyBuffer
    ]);
  });
}

function botguardCalistir(meydan) {
  var yorumlayici = meydan.interpreterJavascript;
  if (!yorumlayici) throw new Error('VM yuklenemedi');
  (0, eval)(yorumlayici);

  var webPoSignalOutput = [];
  window.webPoSignalOutputGlobal = webPoSignalOutput;
  return botguardYukle({
    globalName: meydan.globalName,
    program: meydan.program
  }).then(function () {
    return anlikGoruntu({ webPoSignalOutput: webPoSignalOutput });
  }).then(function (yanit) {
    return { webPoSignalOutput: webPoSignalOutput, botguardResponse: yanit };
  });
}

function botguardBaslat(meydan) {
  window.__potSonuc = null;
  try {
    botguardCalistir(meydan).then(function (r) {
      window.__potSonuc = JSON.stringify({ botguardResponse: r.botguardResponse || '' });
    }).catch(function (e) {
      window.__potSonuc = JSON.stringify({ error: String(e && e.message ? e.message : e) });
    });
  } catch (e) {
    window.__potSonuc = JSON.stringify({ error: String(e && e.message ? e.message : e) });
  }
  return 'baslatildi';
}

var __basici = null;
var __basiciJeton = null;

function poTokenUret(webPoSignalOutput, integrityToken, kimlik) {
  var basiciAl = webPoSignalOutput[0];
  if (!basiciAl) throw new Error('PMD:Undefined');

  var jetonAnahtari = String(integrityToken);
  if (!__basici || __basiciJeton !== jetonAnahtari) {
    __basici = basiciAl(integrityToken);
    __basiciJeton = jetonAnahtari;
  }
  var basici = __basici;

  if (!(basici instanceof Function)) throw new Error('APF:Failed');
  var sonuc = basici(kimlik);
  if (!sonuc) throw new Error('YNJ:Undefined');
  if (!(sonuc instanceof Uint8Array)) throw new Error('ODM:Invalid');
  return sonuc;
}
