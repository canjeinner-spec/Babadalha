plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.aronwebview'
version = '1.0.0'

android {
  namespace "expo.modules.aronwebview"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.11.0'
}
